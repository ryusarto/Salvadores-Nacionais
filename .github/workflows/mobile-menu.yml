name: Mobile menu validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/smoke-mobile-menus.mjs'
      - '.github/workflows/mobile-menu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Portrait, landscape, touch menus and PC regression
        run: CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -1) node tools/smoke-mobile-menus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-menu-evidence
          path: artifacts/mobile-menus/
          retention-days: 7
