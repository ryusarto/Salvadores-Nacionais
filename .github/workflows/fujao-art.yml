name: Fujao art validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'dist/salvadores-nacionais.html'
      - 'tests/**'
      - 'tools/build.mjs'
      - 'tools/smoke-fujao.mjs'
      - 'production/sprites/**'
      - 'production/ui/comic-v1/**'
      - '.github/workflows/fujao-art.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:campaign
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fujao-validated-build
          path: dist/salvadores-nacionais.html
          retention-days: 7
