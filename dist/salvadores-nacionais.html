<script>
/* Letras 5×7 da fonte de pixel dos menus (só as usadas aqui), desenhadas antes de o jogo carregar. */
(function () {
  var G = { S: '.####|#....|#....|.###.|....#|....#|####.', A: '.###.|#...#|#...#|#####|#...#|#...#|#...#', L: '#....|#....|#....|#....|#....|#....|#####',
    V: '#...#|#...#|#...#|#...#|#...#|.#.#.|..#..', D: '####.|#...#|#...#|#...#|#...#|#...#|####.', O: '.###.|#...#|#...#|#...#|#...#|#...#|.###.',
    R: '####.|#...#|#...#|####.|#.#..|#..#.|#...#', E: '#####|#....|#....|####.|#....|#....|#####', N: '#...#|#...#|##..#|#.#.#|#..##|#...#|#...#',
    C: '.###.|#...#|#....|#....|#....|#...#|.###.', I: '###|.#.|.#.|.#.|.#.|.#.|###', G: '.###.|#...#|#....|#.###|#...#|#...#|.####',
    '…': '.....|.....|.....|.....|.....|.....|#.#.#' };
  var STY = { gold: [['#fffbe0', '#fff090', '#ffd848', '#ffb428', '#ff8c18', '#f06414', '#d84010'], '#1a0600', '#5a1000'],
    blue: [['#f0f8ff', '#b8d8ff', '#80b4ff', '#5890ff', '#3c70f0', '#2c58d8', '#2448c0'], '#000428', null] };
  function draw(cv, lines, style) {
    var st = STY[style], pts = [], w = 0, gap = 3;
    lines.forEach(function (line, li) {
      var x = 0;
      for (var k = 0; k < line.length; k++) {
        var rows = G[line[k]].split('|');
        rows.forEach(function (r, y) { for (var q = 0; q < r.length; q++) if (r[q] === '#') pts.push([x + q, y + li * (7 + gap)]); });
        x += rows[0].length + 1;
      }
      w = Math.max(w, x - 1);
    });
    var lw = lines.map(function (line) { var x = 0; for (var k = 0; k < line.length; k++) x += G[line[k]].split('|')[0].length + 1; return x - 1; });
    var h = lines.length * 7 + (lines.length - 1) * gap;
    cv.width = w + 4; cv.height = h + 4;
    var g = cv.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
    // centraliza cada linha
    var off = [], i = 0;
    lines.forEach(function (line, li) { off[li] = Math.floor((w - lw[li]) / 2); });
    pts = pts.map(function (p) { var li = Math.floor(p[1] / (7 + gap)); return [p[0] + off[li] + 2, p[1] + 2, p[1] - li * (7 + gap)]; });
    if (st[2]) { g.fillStyle = st[2]; pts.forEach(function (p) { g.fillRect(p[0], p[1], 3, 3); }); }
    g.fillStyle = st[1]; pts.forEach(function (p) { g.fillRect(p[0] - 1, p[1] - 1, 3, 3); });
    pts.forEach(function (p) { g.fillStyle = st[0][p[2]]; g.fillRect(p[0], p[1], 1, 1); });
  }
  var box = document.getElementById('loading');
  draw(box.querySelector('.sn-title'), ['SALVADORES', 'NACIONAIS'], 'gold');
  draw(box.querySelector('.sn-wait'), ['CARREGANDO…'], 'blue');
})();
</script>

rio.","As panelas n\xE3o param. A fila da comida dobra a esquina. O som est\xE1 no talo.","Na frente do palco, um celular num pau de selfie j\xE1 est\xE1 filmando tudo. Algu\xE9m quer transformar o evento em conte\xFAdo.","Os aliados mant\xEAm a comida e o som funcionando. {hero} segue para enfrentar o Chupetinha na frente do palco."],banheiros:["Bel\xE9m, terceira noite. O evento virou a festa da cidade: tem gente de todo canto e de todo jeito comendo junto.",'Mas, perto dos banheiros qu\xEDmicos, aparecem placas novas, todas carimbadas: "POR DECRETO: CADA UM NO SEU LUGAR".',"Uma fila se forma. Um fiscal pede documento para quem quer usar o banheiro. Ningu\xE9m entende nada.","Ningu\xE9m vai ser barrado no pr\xF3prio evento. {hero} vai direto at\xE9 a cabine enquanto os aliados acolhem a popula\xE7\xE3o."],aeroporto:['A passagem dizia "FUJ\xC3O \u2014 S\xD3 IDA". Os Salvadores correm para o aeroporto antes que o avi\xE3o saia.',"No sagu\xE3o, os aliados re\xFAnem passageiros, pilotos e o pessoal da limpeza. O som mobiliza a popula\xE7\xE3o para abrir passagem.","Enquanto o grupo mant\xE9m o caminho aberto no sagu\xE3o, {hero} avan\xE7a para impedir a fuga.","L\xE1 fora, um avi\xE3o particular j\xE1 est\xE1 com a escada encostada. {hero} segue direto para a pista."],mansao:["O endere\xE7o dos pap\xE9is leva a uma mans\xE3o com port\xE3o de ouro, c\xE2meras em todo canto e seguran\xE7as de terno preto.","L\xE1 dentro mora o Pai do Fuj\xE3o. Em pris\xE3o domiciliar, de tornozeleira, ele nunca sai de casa. Nem precisa: manda em tudo pelo telefone.","Na frente do port\xE3o, os Salvadores montam o som. A roda de rima chama a cidade inteira para a cal\xE7ada.","Os aliados organizam a comunidade diante do port\xE3o. {hero} entra na mans\xE3o para interromper as ordens do Pai do Fuj\xE3o."],washington:["Os Salvadores atravessam o continente. A turn\xEA contra a fome chega a Washington, D.C.","Na frente do pal\xE1cio, as bandeiras est\xE3o rasgadas: o Laranj\xE3o taxou at\xE9 o vento.","Mas o rap atravessa fronteira sem passaporte. Gente do mundo inteiro aparece no gramado com panela, tambor e microfone.","Os aliados recebem a popula\xE7\xE3o e organizam as mesas no gramado. {hero} avan\xE7a para enfrentar o Laranj\xE3o."],inferno:["O gramado se abre e os Salvadores descem. L\xE1 embaixo, fogo, correntes e um trono vazio.","Todos os chefes vieram daqui: a Zanata, o Chupetinha, o Pavanassi, o Fuj\xE3o, o pai dele e o Laranj\xE3o. Todos obedeciam ao mesmo dono.","No port\xE3o do inferno, as almas presas pela fome batem o p\xE9 no ritmo. O \xFAltimo refr\xE3o da turn\xEA come\xE7a.","Todos sustentam o refr\xE3o e abrem caminho at\xE9 o trono. {hero} vai enfrentar o Djabo."]},Ua={zanata:[{who:null,say:"O palco acende. O povo chega. As panelas fumegam. E a\xED o c\xE9u do Ver-o-Peso escurece."},{who:"zanata",say:"Evento sem alvar\xE1, comida de gra\xE7a, povo feliz? Isso aqui est\xE1 INTIMADO."},{who:"$hero",say:"Aqui ningu\xE9m passa fome hoje. Nem que eu tenha que te tirar do palco no bra\xE7o."},{who:"zanata",say:"O Djabo mandou lembran\xE7a. Vem."}],chupetinha:[{who:null,say:"O show come\xE7a. A\xED a m\xFAsica corta. Na frente do palco, o Chupetinha, de chupeta na boca e celular no alto."},{who:"chupetinha",say:"Fala, galera da live! Olha s\xF3: est\xE3o distribuindo comida SEM a minha autoriza\xE7\xE3o."},{who:"$hero",say:"\xC9 comida pro povo, rapaz. Desliga isso e sai do palco."},{who:"chupetinha",say:"Me bateu? EST\xC3O ME CENSURANDO! Isso d\xE1 engajamento, sabia?"},{who:null,say:"DICA: acerte o celular sobre a cabe\xE7a dele (pulando ou com o Gancho) para derrubar a live e cortar a cura."}],pavanassi:[{who:null,say:"Uma cabine gigante despenca no meio da feira. Na frente dela, de terno e carimbo na m\xE3o, o vereador Pavanassi."},{who:"pavanassi",say:"Por decreto meu, cada um no banheiro que EU mandar. Aqui quem decide quem \xE9 quem sou eu."},{who:"$hero",say:"Aqui todo mundo come, todo mundo canta e todo mundo usa o banheiro. Ningu\xE9m fica de fora."},{who:"pavanassi",say:"Desacato! Carimbem esse a\xED! Documento, por favor!"},{who:null,say:"DICA: o carimbo pro\xEDbe golpes por alguns segundos. Cercas e cabine caem na porrada ou no pulo. Perto da cabine, GINGA + AGARR\xC3O faz A PERGUNTA."}],fujao:[{who:null,say:"Na pista, de \xF3culos escuros e mala na m\xE3o, o Fuj\xE3o corre para a escada do avi\xE3o."},{who:"fujao",say:"Voc\xEAs de novo? Eu s\xF3 t\xF4 indo passar uns tempos fora. Uns anos. Pra sempre, talvez."},{who:"$hero",say:"Voc\xEA vai \xE9 ficar e explicar quem manda em tudo isso."},{who:"fujao",say:"Explicar? Eu n\xE3o explico nada. Eu FUJO."},{who:null,say:"DICA: longe do canto, ele foge no meio do combo. Encurrale perto da parede e n\xE3o deixe ele sozinho perto da escada, ou ele embarca e recupera vida."}],"pai-fujao":[{who:null,say:"Na sala, debaixo do lustre, o Pai do Fuj\xE3o desliga o telefone. Na parede, o retrato do filho."},{who:"pai-fujao",say:"Voc\xEAs invadiram a minha casa. Aqui eu tenho foro, tenho advogado e tenho capanga."},{who:"$hero",say:"E a gente tem o povo do lado de fora. Acabou o mando por telefone."},{who:"pai-fujao",say:"Ningu\xE9m encosta em mim. Seguran\xE7a! AL\xD4? Manda todo mundo!"},{who:null,say:"DICA: os 3 primeiros golpes de cada combo n\xE3o fazem dano (Foro Privilegiado). Fa\xE7a combos longos, agarre ou use o super. Empurre-o para fora da \xE1rea da tornozeleira: ela d\xE1 choque."}],laranjao:[{who:null,say:"As portas do pal\xE1cio se abrem. De terno azul, gravata vermelha e topete dourado, sai o Laranj\xE3o."},{who:"laranjao",say:"Comida de gra\xE7a para o mundo inteiro? Isso \xE9 a pior ideia da hist\xF3ria. Talvez a pior de todas."},{who:"$hero",say:"Acabou, Laranj\xE3o. A fome n\xE3o paga tarifa."},{who:"laranjao",say:"Tudo paga tarifa. At\xE9 voc\xEA. E se reclamar: YOU\u2019RE FIRED!"},{who:null,say:"DICA: gastar Ginga e Super d\xE1 armadura para ele (Tarifa Suprema): use com cuidado. Nas Fake News, s\xF3 o verdadeiro tem sombra. No You\u2019re Fired!, pule ou defenda."}],djabo:[{who:null,say:"No trono, de terno preto e tridente na m\xE3o, o Djabo sorri. Ele parece um pol\xEDtico como outro qualquer."},{who:"djabo",say:"A fome \xE9 o meu melhor neg\xF3cio. Povo com fome n\xE3o canta, n\xE3o pensa e n\xE3o reclama."},{who:"$hero",say:"Hoje o povo canta. E come. A turn\xEA acaba aqui, com voc\xEA fora do trono."},{who:"djabo",say:"Voc\xEAs derrubaram meus funcion\xE1rios. Eu n\xE3o sou funcion\xE1rio. Venham."},{who:null,say:"DICA: ele usa um golpe de cada chefe. Zerar a vida dele n\xE3o basta: prepare-se para a segunda forma. No Inferno Nacional, corra para o trecho do ch\xE3o sem fogo ou pule as chamas."}]},v0={zanata:["A Capeta Zanata cai no meio da feira. O chicote se parte em dois.","O primeiro evento da Turn\xEA contra a Fome acontece. O Ver-o-Peso inteiro come e canta junto com {hero}.",'Mas, antes de sumir, a Zanata deixa um aviso: "O Chupetinha j\xE1 est\xE1 na frente do palco. E ele est\xE1 AO VIVO."',"A turn\xEA continua."],chupetinha:["O celular estoura no ch\xE3o. A live cai. Sem plateia virtual, o Chupetinha chora de verdade, agarrado na chupeta.","O show recome\xE7a. O Ver-o-Peso inteiro come, dan\xE7a e canta o refr\xE3o junto com {hero}.",'Mas, nos banheiros qu\xEDmicos do evento, aparecem placas novas, carimbadas e assinadas: "POR DECRETO, VEREADOR PAVANASSI".',"A turn\xEA continua."],pavanassi:["A cabine desaba. Os decretos do Pavanassi pegam fogo e viram cinza no meio da feira.","As placas s\xE3o arrancadas uma por uma. No palco, as cores da bandeira trans sobem junto com o som, e a plateia inteira canta com {hero}.",'No ch\xE3o, entre os pap\xE9is queimados, uma passagem de avi\xE3o carimbada: "FUJ\xC3O \u2014 S\xD3 IDA". Algu\xE9m quer fugir do pa\xEDs.',"A turn\xEA continua. Pr\xF3xima parada: o aeroporto."],fujao:["O Fuj\xE3o cai na pista, a mala abre e voam pap\xE9is por todo lado. O avi\xE3o vai embora vazio.","Os Salvadores entregam o Fuj\xE3o \xE0 seguran\xE7a do aeroporto. A fuga terminou; agora ele vai responder pelo que fez.","Entre os pap\xE9is, ordens assinadas, carimbos e fotos do Chupetinha, da Zanata e do Pavanassi. Todas vindas do mesmo endere\xE7o: uma mans\xE3o.","O dono da mans\xE3o est\xE1 em pris\xE3o domiciliar. E continua mandando em tudo de dentro de casa. Pr\xF3xima parada: a mans\xE3o do pai do Fuj\xE3o."],"pai-fujao":["A tornozeleira apita uma \xFAltima vez. O Pai do Fuj\xE3o desaba no sof\xE1, sem foro, sem capanga e sem sinal no telefone.","A cidade entra pelo port\xE3o aberto. A mans\xE3o vira cozinha comunit\xE1ria, e o lustre ilumina o maior sarau que aquela sala j\xE1 viu, com {hero} no centro.",'Encurralado, o velho entrega quem est\xE1 acima de todos: "Eu s\xF3 obede\xE7o. As ordens v\xEAm dos Estados Unidos. Do Laranj\xE3o."',"Para salvar o mundo, os Salvadores precisam atravessar o continente. Pr\xF3xima parada: Washington, D.C."],laranjao:["A muralha dourada cai tijolo por tijolo. As manchetes falsas se apagam uma por uma. O Laranj\xE3o fica sem armadura e sem plateia.","No gramado, o povo do mundo inteiro come junto. {hero} rima em portugu\xEAs, e todo mundo canta o refr\xE3o.",'Derrotado, o Laranj\xE3o aponta para o ch\xE3o e ri: "Voc\xEAs acham que mandam aqui? Quem manda est\xE1 l\xE1 embaixo."',"O ch\xE3o do gramado racha. Sobe um cheiro de enxofre. \xDAltima parada da turn\xEA: o inferno do Djabo."],djabo:["O Djabo cai do trono. O fogo do inferno se apaga, as correntes se partem e as almas presas pela fome sobem para a luz.","L\xE1 em cima, todos os Salvadores Nacionais sobem no mesmo palco para o maior show contra a fome da hist\xF3ria.","Em Bel\xE9m, em Washington, em cada cidade do Brasil e do mundo, as mesas ficam cheias. Ningu\xE9m fica de fora.","A FOME ACABOU. Em nenhum canto do mundo algu\xE9m vai dormir com fome esta noite. Nem amanh\xE3.","{ending}","SALVADORES NACIONAIS \u2014 fim da Turn\xEA contra a Fome. Obrigado por jogar!"]},$t={franco:"Franco fotografa a primeira mesa cheia
