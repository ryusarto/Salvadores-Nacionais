    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) pad.addEventListener(ev, release);
    window.addEventListener("touchstart", show, { once: true, passive: true });
    if (window.matchMedia?.("(pointer: coarse)").matches) show();
    return { show };
  }

  // src/main.js
  var canvas = document.getElementById("game");
  var devices = createDevices(window);
  var q = new URLSearchParams(location.search);
  var touch = createTouch(devices);
  if (q.has("touch")) touch.show();
  var app = createApp(canvas, devices, { boxes: q.has("boxes"), autoplay: q.has("auto") });
  function fit() {
    const r = Math.min(innerWidth / 1920, innerHeight / 1080);
    app.touchUI = document.documentElement.classList.contains("touch");
    canvas.style.width = `${Math.floor(1920 * r)}px`;
    canvas.style.height = `${Math.floor(1080 * r)}px`;
  }
  addEventListener("resize", fit);
  addEventListener("touchstart", () => setTimeout(fit, 50), { once: true, passive: true });
  fit();
  window.__app = app;
  var packs = q.get("sprites") === "off" ? {} : window.__SPRITES || {};
  Promise.all(Object.entries(packs).map(([id, sheets]) => registerSprites(id, sheets))).then(() => app.run());
})();
</script>
</body>
