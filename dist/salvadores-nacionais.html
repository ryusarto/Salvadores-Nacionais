<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SALVADORES NACIONAIS — Build de Combate</title>
<style>
  html, body { margin: 0; height: 100%; background: #08040a; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; background: #12080c; }
  #sound {position:fixed;right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:3;border:2px solid #17131b;border-radius:0;background:#f4e9c9;color:#17131b;font:15px SNComic,Arial,sans-serif;padding:5px 12px;cursor:pointer;}
  /* Fora do menu inicial o botão cobriria títulos, nomes e medidores: na luta o som fica na pausa. */
  body:not([data-screen="title"]):not([data-screen="controls"]) #sound {display:none;}
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; font-family: Impact, 'Arial Black', sans-serif; }
  .touch #touch { display: block; }
  #touch > * { pointer-events: auto; position: absolute; }
  #dpad { left: max(3vw, env(safe-area-inset-left)); bottom: 6vh; width: 40vh; height: 40vh; border-radius: 50%; background: rgba(255,255,255,.10); border: 2px solid rgba(255,255,255,.35); }
  #dpad .a { position: absolute; font-style: normal; color: rgba(255,255,255,.6); font-size: 5vh; pointer-events: none; }
  #dpad .up { top: 5%; left: 50%; transform: translateX(-50%); }
  #dpad .down { bottom: 5%; left: 50%; transform: translateX(-50%); }
  #dpad .left { left: 6%; top: 50%; transform: translateY(-50%); }
  #dpad .right { right: 6%; top: 50%; transform: translateY(-50%); }
  #knob { position: absolute; left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%; background: rgba(255,255,255,.28); border: 2px solid rgba(255,255,255,.6); pointer-events: none; }
  #btns { right: max(2.5vw, env(safe-area-inset-right)); bottom: 5vh; display: grid; grid-template-columns: repeat(3, 17vh); gap: 2.2vh 2.4vh; }
  .tb { width: 17vh; height: 17vh; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.13); color: #fff; font: italic 900 3.1vh Impact, 'Arial Black', sans-serif; padding: 0; -webkit-tap-highlight-color: transparent; }
  .tb.on, #tpause.on { background: rgba(255,255,255,.45); transform: scale(.94); }
  .tb-l, .tb-m, .tb-h { transform: translateY(0); }
  .tb-s { transform: translateY(-2.5vh); } .tb-x { transform: translateY(-5vh); }
  .tb-m { transform: translateY(-2.5vh); } .tb-h { transform: translateY(-5vh); }
  .tb-g { border-color: rgba(53,214,192,.9); color: #9ff5e8; }
  .tb-s { border-color: rgba(255,207,42,.9); color: #ffe14a; }
  .tb-x { border-color: rgba(255,122,46,.9); color: #ffb37a; }
  #tpause { top: 2vh; left: max(1.5vw, env(safe-area-inset-left)); width: 11vh; height: 8vh; border-radius: 2vh; border: 2px solid rgba(255,255,255,.4); background: rgba(0,0,0,.35); color: #fff; font: 900 3vh Arial, sans-serif; }
  #rotate { display: none; inset: 0; background: #12080c; color: #ffcf2a; font-size: 7vw; align-items: center; justify-content: center; text-align: center; padding: 8vw; font-style: italic; }
  @media (orientation: portrait) { .touch body[data-screen="fight"][data-paused="false"] #rotate { display: flex; } }
  /* Carregamento no mesmo visual clássico dos menus: fundo preto, letras de pixel douradas e barra em blocos. */
  #loading {position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vmin;background:#000;}
  #loading canvas {display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
  #loading .sn-title {width:min(78vw,120vmin);}
  #loading .sn-wait {width:min(34vw,52vmin);animation:sn-blink 1s steps(1) infinite;}
  #loading i {display:block;width:min(46vw,70vmin);height:3.2vmin;border:.8vmin solid #f8c820;background:#000;overflow:hidden;position:relative;box-shadow:0 0 0 .8vmin #000,0 0 0 1.4vmin #5a1000;}
  #loading i::after {content:"";position:absolute;top:.6vmin;bottom:.6vmin;left:.6vmin;width:30%;background:repeating-linear-gradient(90deg,#ffd848 0 2.4vmin,#ff8c18 2.4vmin 3.2vmin,transparent 3.2vmin 4vmin);animation:sn-load 1.2s steps(8) infinite alternate;}
  #loading .sr {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
  @keyframes sn-load {from{transform:translateX(0)}to{transform:translateX(225%)}}
  @keyframes sn-blink {0%{opacity:1}70%{opacity:0}}
  @media (prefers-reduced-motion: reduce) { #loading i::after { animation:none; width:calc(100% - 1.2vmin); } #loading .sn-wait { animation:none; } }

  [hidden] { display:none !important; }
  #accessible-menu { position:fixed;left:var(--canvas-left);top:var(--canvas-top);width:var(--canvas-width);height:var(--canvas-height);z-index:5;pointer-events:none; }
  #accessible-menu h1,#accessible-menu p {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
  #accessible-menu nav {position:absolute;inset:0;pointer-events:none;}
  #accessible-menu button {position:absolute;pointer-events:auto;opacity:0;cursor:pointer;border:3px solid #f3c426;}
  #accessible-menu button:focus-visible {opacity:1;background:#17131b;color:#f4e9c9;font:24px SNComic,Arial,sans-serif;outline:4px solid #f3c426;}
  #accessible-menu button img {width:32px;height:32px;object-fit:contain;}
  #touch:not([data-live="true"]) #dpad,#touch:not([data-live="true"]) #btns,#touch:not([data-live="true"]) #tpause,#touch:not([data-live="true"]) #question {display:none;}
  #tpause {min-width:44px;min-height:44px;}
  .tb-t {grid-column:2;transform:none;width:100%;height:44px;border-radius:10px;font-size:14px;}
  #btns {bottom:max(16vh,env(safe-area-inset-bottom));grid-template-columns:repeat(3,var(--touch-size,15vh));gap:1.5vh;}
  .tb {width:var(--touch-size,15vh);height:var(--touch-size,15vh);min-width:44px;min-height:44px;font-size:clamp(11px,2.7vh,18px);}
  #dpad {bottom:16vh;width:36vh;height:36vh;}
  #question {left:43%;bottom:12vh;width:auto;padding:8px;height:44px;border-radius:10px;font-size:12px;}
  #training-tools {position:fixed;top:15vh;left:22%;right:22%;display:flex;gap:4px;justify-content:center;}
  #training-tools button,#lesson-panel button {min-height:44px;background:#f4e9c9;color:#17131b;border:2px solid #17131b;font:14px SNComic,Arial,sans-serif;padding:4px 8px;}
  #lesson-panel {position:fixed;left:18%;right:18%;top:14vh;background:#17131b;color:#f4e9c9;font:14px Arial,sans-serif;padding:8px;display:flex;align-items:center;gap:8px;}
  #rotate {z-index:30;pointer-events:auto;}
  .large-buttons {--touch-size:17vh;}
  .left-handed #dpad {left:auto;right:3vw;}
  .left-handed #btns {right:auto;left:2.5vw;}
  /* PC keeps its canvas hit targets. Touch reflows the same actions and art. */
  #accessible-menu .mobile-menu-title,#accessible-menu .mobile-menu-logo,
  #accessible-menu .mobile-button-label,#accessible-menu .mobile-menu-art {display:none;}
  #accessible-menu .mobile-menu-details {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
  #accessible-menu .mobile-menu-hint {display:none;}
  #touch {z-index:4;}
  .touch body[data-menu-open="true"] {touch-action:pan-y;}
  .touch #accessible-menu {
    inset:0;width:100%;height:100%;height:100dvh;box-sizing:border-box;
    padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
    background:#080b51;color:#f2e6c4;pointer-events:auto;overflow:hidden;
    font:15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
    background-image:radial-gradient(#1a287d 1px,transparent 1px);background-size:6px 6px;
  }
  .touch #accessible-menu * {box-sizing:border-box;}
  .touch #accessible-menu .mobile-menu-header {border-bottom:2px solid #f8c820;padding:4px 0 10px;min-width:0;}
  .touch #accessible-menu .mobile-menu-title {display:block;background:transparent;image-rendering:pixelated;max-width:100%;width:auto;height:auto;max-height:68px;}
  .touch #accessible-menu .mobile-menu-logo {display:block;background:transparent;image-rendering:pixelated;width:min(80vw,370px);height:auto;margin:auto;max-height:26dvh;object-fit:contain;}
  .touch #accessible-menu h1 {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
  .touch #accessible-menu p {position:static;width:auto;height:auto;overflow:visible;clip-path:none;margin:0;}
  .touch #accessible-menu .mobile-menu-hint {display:block;color:#86cfff;font-size:12px;text-align:center;margin-top:10px;}
  .touch #accessible-menu .mobile-menu-body {min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-color:#f8c820 #050829;display:flex;gap:16px;align-items:flex-start;padding:4px;}
  .touch #accessible-menu .mobile-menu-content {flex:1;min-width:0;}
  .touch #accessible-menu .mobile-menu-content>p {color:#d9e4ff;margin:0 0 14px;overflow-wrap:anywhere;}
  .touch #accessible-menu .mobile-menu-content>p:empty {display:none;}
  .touch #accessible-menu nav {position:static;inset:auto;pointer-events:auto;}
  .touch #accessible-menu nav[aria-label="Escolhas"] {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .touch #accessible-menu button {
    position:relative;left:auto!important;top:auto!important;opacity:1;width:100%!important;height:auto!important;
    min-width:0;min-height:52px;padding:10px 12px;border:2px solid #526be1;border-radius:0;
    background:#070c39;color:#f2e6c4;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:inset 0 0 0 2px #020517;font:inherit;touch-action:pan-y;-webkit-tap-highlight-color:transparent;
  }
  .touch #accessible-menu button:active {background:#202d85;}
  .touch #accessible-menu button[aria-pressed="true"] {border-color:#ffd848;background:#25184e;box-shadow:inset 0 0 0 2px #63321b;}
  .touch #accessible-menu button:focus-visible {outline:3px solid #fff6bd;outline-offset:2px;}
  .touch #accessible-menu button:disabled {opacity:.5;cursor:default;}
  .touch #accessible-menu .menu-button-text {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
  .touch #accessible-menu .mobile-button-label {display:block;background:transparent;image-rendering:pixelated;max-width:100%;width:auto;height:auto;pointer-events:none;}
  .touch #accessible-menu button img {width:52px;height:52px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;}
  .touch #accessible-menu .mobile-menu-art {display:block;width:clamp(120px,23vw,220px);flex-shrink:0;position:sticky;top:0;border:2px solid #526be1;background:linear-gradient(#1329ad,#080b51);box-shadow:inset 0 0 0 3px #030724;}
  .touch #accessible-menu .mobile-menu-art canvas {width:100%;height:auto;background:transparent;image-rendering:pixelated;}
  .touch #accessible-menu .mobile-menu-actions {display:grid;grid-template-columns:minmax(100px,1fr) minmax(140px,2fr);gap:10px;padding:10px 4px 0;border-top:2px solid #526be1;background:#080b51;}
  .touch #accessible-menu .mobile-menu-actions button[data-role="back"] {grid-column:1;grid-row:1;}
  .touch #accessible-menu .mobile-menu-actions button[data-role="primary"] {grid-column:2;grid-row:1;border-color:#ffd848;background:#25184e;}
  .touch #accessible-menu .mobile-menu-actions button:only-child {grid-column:1/-1;}
  .touch #accessible-menu[data-layout="select"] nav[aria-label="Escolhas"] {grid-template-columns:repeat(4,minmax(0,1fr));}
  .touch #accessible-menu[data-layout="select"] button[data-role="fighter"] {flex-direction:column;padding:6px;gap:4px;min-height:96px;}
  .touch #accessible-menu[data-layout="select"] .mobile-button-label {object-fit:contain;}
  .touch #accessible-menu[data-layout="title"] {background:#000;background-image:none;}
  .touch #accessible-menu[data-layout="title"] .mobile-menu-header {border:0;align-self:center;}
  .touch #accessible-menu[data-layout="title"] .mobile-menu-body {display:flex;align-items:center;justify-content:center;}
  .touch #accessible-menu[data-layout="title"] .mobile-menu-content {flex:none;width:min(100%,520px);}
  .touch #accessible-menu[data-layout="title"] nav[aria-label="Escolhas"] {grid-template-columns:1fr;}
  .touch #accessible-menu[data-layout="title"] button {background:#000;border-color:transparent;}
  .touch #accessible-menu[data-layout="title"] button[aria-pressed="true"] {border-color:#ffd848;background:#09051c;box-shadow:inset 4px 0 #ffd848;}
  .touch #accessible-menu[data-layout="versus"] .mobile-menu-art {width:clamp(180px,35vw,280px);}
  .touch #accessible-menu[data-screen="selectStage"] .mobile-menu-art {width:clamp(220px,35vw,360px);}
  .touch #accessible-menu[data-screen="selectStage"] nav[aria-label="Escolhas"] {grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width:359px) { .touch #accessible-menu[data-screen="selectStage"] nav[aria-label="Escolhas"] {grid-template-columns:1fr;} }
  .touch #accessible-menu[data-layout="story"] .mobile-menu-content>p {white-space:pre-line;font-size:16px;line-height:1.65;}
  .touch #accessible-menu .mobile-menu-details {position:static;width:auto;height:auto;overflow:visible;clip-path:none;display:grid;grid-template-columns:minmax(90px,1fr) 2fr;gap:0;margin:12px 0;}
  .touch #accessible-menu .mobile-menu-details dt,.touch #accessible-menu .mobile-menu-details dd {margin:0;padding:12px 8px;border-bottom:1px solid #526be1;overflow-wrap:anywhere;}
  .touch #accessible-menu .mobile-menu-details dt {color:#86dfff;}
  @media (orientation:portrait) {
    .touch #accessible-menu .mobile-menu-body {flex-direction:column;}
    .touch #accessible-menu .mobile-menu-art {position:static;width:140px;align-self:center;}
    .touch #accessible-menu .mobile-menu-content {width:100%;flex:none;}
    .touch #accessible-menu[data-layout="select"] nav[aria-label="Escolhas"] {grid-template-columns:repeat(3,minmax(0,1fr));}
    .touch #accessible-menu[data-layout="select"] .mobile-menu-art {display:none;}
    .touch #accessible-menu[data-layout="versus"] .mobile-menu-art {width:200px;}
    .touch #accessible-menu[data-screen="selectStage"] .mobile-menu-art {width:min(100%,320px);}
    .touch #accessible-menu[data-layout="title"] .mobile-menu-body {flex-direction:row;}
    .touch #accessible-menu nav[aria-label="Escolhas"] {grid-template-columns:1fr;}
  }
  @media (max-height:450px) and (orientation:landscape) {
    .touch #accessible-menu {gap:8px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom));font-size:13px;}
    .touch #accessible-menu .mobile-menu-header {padding-bottom:6px;}
    .touch #accessible-menu .mobile-menu-title {max-height:40px;}
    .touch #accessible-menu .mobile-menu-actions {padding-top:6px;}
    .touch #accessible-menu .mobile-menu-content>p {margin-bottom:8px;}
    .touch #accessible-menu .mobile-menu-art {width:140px;}
    .touch #accessible-menu[data-layout="title"] {grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:24px;}
    .touch #accessible-menu[data-layout="title"] .mobile-menu-logo {max-height:50dvh;width:100%;}
    .touch #accessible-menu[data-layout="title"] .mobile-menu-title {max-height:none;}
    .touch #accessible-menu[data-layout="title"] .mobile-menu-hint {margin-top:16px;}
    .touch #accessible-menu[data-layout="title"] button {min-height:48px;padding:6px;}
    .touch #accessible-menu[data-layout="select"] .mobile-menu-art {width:120px;}
  }
  @media (max-width:359px) {
    .touch #accessible-menu[data-layout="select"] nav[aria-label="Escolhas"] {grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  .tb.tb-t {width:100%;height:44px;min-height:44px;transform:none;}
  .touch #sound {display:none;}
</style>

<body>
<canvas id="game" width="1920" height="1080" aria-label="Arena de combate Salvadores Nacionais"></canvas>
<div id="loading" role="status" aria-live="polite"><span class="sr">Salvadores Nacionais. Carregando…</span><canvas class="sn-title" aria-hidden="true"></canvas><i></i><canvas class="sn-wait" aria-hidden="true"></canvas></div>
<script>
/* Letras 5×7 da fonte de pixel dos menus (só as usadas aqui), desenhadas antes de o jogo carregar. */
(function () {
  var G = { S: '.####|#....|#....|.###.|....#|....#|####.', A: '.###.|#...#|#...#|#####|#...#|#...#|#...#', L: '#....|#....|#....|#....|#....|#....|#####',
    V: '#...#|#...#|#...#|#...#|#...#|.#.#.|..#..', D: '####.|#...#|#...#|#...#|#...#|#...#|####.', O: '.###.|#...#|#...#|#...#|#...#|#...#|.###.',
    R: '####.|#...#|#...#|####.|#.#..|#..#.|#...#', E: '#####|#....|#....|####.|#....|#....|#####', N: '#...#|#...#|##..#|#.#.#|#..##|#...#|#...#',
    C: '.###.|#...#|#....|#....|#....|#...#|.###.', I: '###|.#.|.#.|.#.|.#.|.#.|###', G: '.###.|#...#|#....|#.###|#...#|#...#|.####',
    '…': '.....|.....|.....|.....|.....|.....|#.#.#' };
  var STY = { gold: [['#fffbe0', '#fff090', '#ffd848', '#ffb428', '#ff8c18', '#f06414', '#d84010'], '#1a0600', '#5a1000'],
    blue: [['#f0f8ff', '#b8d8ff', '#80b4ff', '#5890ff', '#3c70f0', '#2c58d8', '#2448c0'], '#000428', null] };
  function draw(cv, lines, style) {
    var st = STY[style], pts = [], w = 0, gap = 3;
    lines.forEach(function (line, li) {
      var x = 0;
      for (var k = 0; k < line.length; k++) {
        var rows = G[line[k]].split('|');
        rows.forEach(function (r, y) { for (var q = 0; q < r.length; q++) if (r[q] === '#') pts.push([x + q, y + li * (7 + gap)]); });
        x += rows[0].length + 1;
      }
      w = Math.max(w, x - 1);
    });
    var lw = lines.map(function (line) { var x = 0; for (var k = 0; k < line.length; k++) x += G[line[k]].split('|')[0].length + 1; return x - 1; });
    var h = lines.length * 7 + (lines.length - 1) * gap;
    cv.width = w + 4; cv.height = h + 4;
    var g = cv.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
    // centraliza cada linha
    var off = [], i = 0;
    lines.forEach(function (line, li) { off[li] = Math.floor((w - lw[li]) / 2); });
    pts = pts.map(function (p) { var li = Math.floor(p[1] / (7 + gap)); return [p[0] + off[li] + 2, p[1] + 2, p[1] - li * (7 + gap)]; });
    if (st[2]) { g.fillStyle = st[2]; pts.forEach(function (p) { g.fillRect(p[0], p[1], 3, 3); }); }
    g.fillStyle = st[1]; pts.forEach(function (p) { g.fillRect(p[0] - 1, p[1] - 1, 3, 3); });
    pts.forEach(function (p) { g.fillStyle = st[0][p[2]]; g.fillRect(p[0], p[1], 1, 1); });
  }
  var box = document.getElementById('loading');
  draw(box.querySelector('.sn-title'), ['SALVADORES', 'NACIONAIS'], 'gold');
  draw(box.querySelector('.sn-wait'), ['CARREGANDO…'], 'blue');
})();

(()=>{var le=[{id:"ver-o-peso",n:1,boss:"zanata",bossName:"CAPETA ZANATA",place:"BEL\xC9M \u2014 VER-O-PESO",ready:!0},{id:"palco",n:2,boss:"chupetinha",bossName:"CHUPETINHA",place:"BEL\xC9M \u2014 FRENTE DO PALCO",ready:!0},{id:"banheiros",n:3,boss:"pavanassi",bossName:"PAVANASSI",place:"BEL\xC9M \u2014 BANHEIROS QU\xCDMICOS",ready:!0},{id:"aeroporto",n:4,boss:"fujao",bossName:"FUJ\xC3O",place:"AEROPORTO",ready:!0},{id:"mansao",n:5,boss:"pai-fujao",bossName:"PAI DO FUJ\xC3O",place:"MANS\xC3O",ready:!0},{id:"washington",n:6,boss:"laranjao",bossName:"LARANJ\xC3O",place:"WASHINGTON, D.C.",ready:!0},{id:"inferno",n:7,boss:"djabo",bossName:"DJABO",place:"INFERNO",ready:!0}],ri={"ver-o-peso":["Num Brasil de outra realidade, os pol\xEDticos s\xE3o vil\xF5es com poderes. E usam esses poderes para oprimir o povo.","Os Salvadores Nacionais t\xEAm poderes tamb\xE9m. E um plano: acabar com a fome com o rap.","Primeira parada da Turn\xEA contra a Fome: Bel\xE9m do Par\xE1. Palco montado no Ver-o-Peso, comida para quem chegar.","Os aliados cuidam do palco e das panelas. {hero} protege o primeiro evento quando a Capeta Zanata invade o Ver-o-Peso."],palco:["Bel\xE9m, segunda noite. A Zanata caiu, e o evento cresceu: agora o palco est\xE1 montado de frente para o rio.","As panelas n\xE3o param. A fila da comida dobra a esquina. O som est\xE1 no talo.","Na frente do palco, um celular num pau de selfie j\xE1 est\xE1 filmando tudo. Algu\xE9m quer transformar o evento em conte\xFAdo.","Os aliados mant\xEAm a comida e o som funcionando. {hero} segue para enfrentar o Chupetinha na frente do palco."],banheiros:["Bel\xE9m, terceira noite. O evento virou a festa da cidade: tem gente de todo canto e de todo jeito comendo junto.",'Mas, perto dos banheiros qu\xEDmicos, aparecem placas novas, todas carimbadas: "POR DECRETO: CADA UM NO SEU LUGAR".',"Uma fila se forma. Um fiscal pede documento para quem quer usar o banheiro. Ningu\xE9m entende nada.","Ningu\xE9m vai ser barrado no pr\xF3prio evento. {hero} vai direto at\xE9 a cabine enquanto os aliados acolhem a popula\xE7\xE3o."],aeroporto:['A passagem dizia "FUJ\xC3O \u2014 S\xD3 IDA". Os Salvadores correm para o aeroporto antes que o avi\xE3o saia.',"No sagu\xE3o, os aliados re\xFAnem passageiros, pilotos e o pessoal da limpeza. O som mobiliza a popula\xE7\xE3o para abrir passagem.","Enquanto o grupo mant\xE9m o caminho aberto no sagu\xE3o, {hero} avan\xE7a para impedir a fuga.","L\xE1 fora, um avi\xE3o particular j\xE1 est\xE1 com a escada encostada. {hero} segue direto para a pista."],mansao:["O endere\xE7o dos pap\xE9is leva a uma mans\xE3o com port\xE3o de ouro, c\xE2meras em todo canto e seguran\xE7as de terno preto.","L\xE1 dentro mora o Pai do Fuj\xE3o. Em pris\xE3o domiciliar, de tornozeleira, ele nunca sai de casa. Nem precisa: manda em tudo pelo telefone.","Na frente do port\xE3o, os Salvadores montam o som. A roda de rima chama a cidade inteira para a cal\xE7ada.","Os aliados organizam a comunidade diante do port\xE3o. {hero} entra na mans\xE3o para interromper as ordens do Pai do Fuj\xE3o."],washington:["Os Salvadores atravessam o continente. A turn\xEA contra a fome chega a Washington, D.C.","Na frente do pal\xE1cio, as bandeiras est\xE3o rasgadas: o Laranj\xE3o taxou at\xE9 o vento.","Mas o rap atravessa fronteira sem passaporte. Gente do mundo inteiro aparece no gramado com panela, tambor e microfone.","Os aliados recebem a popula\xE7\xE3o e organizam as mesas no gramado. {hero} avan\xE7a para enfrentar o Laranj\xE3o."],inferno:["O gramado se abre e os Salvadores descem. L\xE1 embaixo, fogo, correntes e um trono vazio.","Todos os chefes vieram daqui: a Zanata, o Chupetinha, o Pavanassi, o Fuj\xE3o, o pai dele e o Laranj\xE3o. Todos obedeciam ao mesmo dono.","No port\xE3o do inferno, as almas presas pela fome batem o p\xE9 no ritmo. O \xFAltimo refr\xE3o da turn\xEA come\xE7a.","Todos sustentam o refr\xE3o e abrem caminho at\xE9 o trono. {hero} vai enfrentar o Djabo."]},Ta={zanata:[{who:null,say:"O palco acende. O povo chega. As panelas fumegam. E a\xED o c\xE9u do Ver-o-Peso escurece."},{who:"zanata",say:"Evento sem alvar\xE1, comida de gra\xE7a, povo feliz? Isso aqui est\xE1 INTIMADO."},{who:"$hero",say:"Aqui ningu\xE9m passa fome hoje. Nem que eu tenha que te tirar do palco no bra\xE7o."},{who:"zanata",say:"O Djabo mandou lembran\xE7a. Vem."}],chupetinha:[{who:null,say:"O show come\xE7a. A\xED a m\xFAsica corta. Na frente do palco, o Chupetinha, de chupeta na boca e celular no alto."},{who:"chupetinha",say:"Fala, galera da live! Olha s\xF3: est\xE3o distribuindo comida SEM a minha autoriza\xE7\xE3o."},{who:"$hero",say:"\xC9 comida pro povo, rapaz. Desliga isso e sai do palco."},{who:"chupetinha",say:"Me bateu? EST\xC3O ME CENSURANDO! Isso d\xE1 engajamento, sabia?"},{who:null,say:"DICA: acerte o celular sobre a cabe\xE7a dele (pulando ou com o Gancho) para derrubar a live e cortar a cura."}],pavanassi:[{who:null,say:"Uma cabine gigante despenca no meio da feira. Na frente dela, de terno e carimbo na m\xE3o, o vereador Pavanassi."},{who:"pavanassi",say:"Por decreto meu, cada um no banheiro que EU mandar. Aqui quem decide quem \xE9 quem sou eu."},{who:"$hero",say:"Aqui todo mundo come, todo mundo canta e todo mundo usa o banheiro. Ningu\xE9m fica de fora."},{who:"pavanassi",say:"Desacato! Carimbem esse a\xED! Documento, por favor!"},{who:null,say:"DICA: o carimbo pro\xEDbe golpes por alguns segundos. Cercas e cabine caem na porrada ou no pulo. Perto da cabine, GINGA + AGARR\xC3O faz A PERGUNTA."}],fujao:[{who:null,say:"Na pista, de \xF3culos escuros e mala na m\xE3o, o Fuj\xE3o corre para a escada do avi\xE3o."},{who:"fujao",say:"Voc\xEAs de novo? Eu s\xF3 t\xF4 indo passar uns tempos fora. Uns anos. Pra sempre, talvez."},{who:"$hero",say:"Voc\xEA vai \xE9 ficar e explicar quem manda em tudo isso."},{who:"fujao",say:"Explicar? Eu n\xE3o explico nada. Eu FUJO."},{who:null,say:"DICA: longe do canto, ele foge no meio do combo. Encurrale perto da parede e n\xE3o deixe ele sozinho perto da escada, ou ele embarca e recupera vida."}],"pai-fujao":[{who:null,say:"Na sala, debaixo do lustre, o Pai do Fuj\xE3o desliga o telefone. Na parede, o retrato do filho."},{who:"pai-fujao",say:"Voc\xEAs invadiram a minha casa. Aqui eu tenho foro, tenho advogado e tenho capanga."},{who:"$hero",say:"E a gente tem o povo do lado de fora. Acabou o mando por telefone."},{who:"pai-fujao",say:"Ningu\xE9m encosta em mim. Seguran\xE7a! AL\xD4? Manda todo mundo!"},{who:null,say:"DICA: os 3 primeiros golpes de cada combo n\xE3o fazem dano (Foro Privilegiado). Fa\xE7a combos longos, agarre ou use o super. Empurre-o para fora da \xE1rea da tornozeleira: ela d\xE1 choque."}],laranjao:[{who:null,say:"As portas do pal\xE1cio se abrem. De terno azul, gravata vermelha e topete dourado, sai o Laranj\xE3o."},{who:"laranjao",say:"Comida de gra\xE7a para o mundo inteiro? Isso \xE9 a pior ideia da hist\xF3ria. Talvez a pior de todas."},{who:"$hero",say:"Acabou, Laranj\xE3o. A fome n\xE3o paga tarifa."},{who:"laranjao",say:"Tudo paga tarifa. At\xE9 voc\xEA. E se reclamar: YOU\u2019RE FIRED!"},{who:null,say:"DICA: gastar Ginga e Super d\xE1 armadura para ele (Tarifa Suprema): use com cuidado. Nas Fake News, s\xF3 o verdadeiro tem sombra. No You\u2019re Fired!, pule ou defenda."}],djabo:[{who:null,say:"No trono, de terno preto e tridente na m\xE3o, o Djabo sorri. Ele parece um pol\xEDtico como outro qualquer."},{who:"djabo",say:"A fome \xE9 o meu melhor neg\xF3cio. Povo com fome n\xE3o canta, n\xE3o pensa e n\xE3o reclama."},{who:"$hero",say:"Hoje o povo canta. E come. A turn\xEA acaba aqui, com voc\xEA fora do trono."},{who:"djabo",say:"Voc\xEAs derrubaram meus funcion\xE1rios. Eu n\xE3o sou funcion\xE1rio. Venham."},{who:null,say:"DICA: ele usa um golpe de cada chefe. Zerar a vida dele n\xE3o basta: prepare-se para a segunda forma. No Inferno Nacional, corra para o trecho do ch\xE3o sem fogo ou pule as chamas."}]},ni={zanata:["A Capeta Zanata cai no meio da feira. O chicote se parte em dois.","O primeiro evento da Turn\xEA contra a Fome acontece. O Ver-o-Peso inteiro come e canta junto com {hero}.",'Mas, antes de sumir, a Zanata deixa um aviso: "O Chupetinha j\xE1 est\xE1 na frente do palco. E ele est\xE1 AO VIVO."',"A turn\xEA continua."],chupetinha:["O celular estoura no ch\xE3o. A live cai. Sem plateia virtual, o Chupetinha chora de verdade, agarrado na chupeta.","O show recome\xE7a. O Ver-o-Peso inteiro come, dan\xE7a e canta o refr\xE3o junto com {hero}.",'Mas, nos banheiros qu\xEDmicos do evento, aparecem placas novas, carimbadas e assinadas: "POR DECRETO, VEREADOR PAVANASSI".',"A turn\xEA continua."],pavanassi:["A cabine desaba. Os decretos do Pavanassi pegam fogo e viram cinza no meio da feira.","As placas s\xE3o arrancadas uma por uma. No palco, as cores da bandeira trans sobem junto com o som, e a plateia inteira canta com {hero}.",'No ch\xE3o, entre os pap\xE9is queimados, uma passagem de avi\xE3o carimbada: "FUJ\xC3O \u2014 S\xD3 IDA". Algu\xE9m quer fugir do pa\xEDs.',"A turn\xEA continua. Pr\xF3xima parada: o aeroporto."],fujao:["O Fuj\xE3o cai na pista, a mala abre e voam pap\xE9is por todo lado. O avi\xE3o vai embora vazio.","Os Salvadores entregam o Fuj\xE3o \xE0 seguran\xE7a do aeroporto. A fuga terminou; agora ele vai responder pelo que fez.","Entre os pap\xE9is, ordens assinadas, carimbos e fotos do Chupetinha, da Zanata e do Pavanassi. Todas vindas do mesmo endere\xE7o: uma mans\xE3o.","O dono da mans\xE3o est\xE1 em pris\xE3o domiciliar. E continua mandando em tudo de dentro de casa. Pr\xF3xima parada: a mans\xE3o do pai do Fuj\xE3o."],"pai-fujao":["A tornozeleira apita uma \xFAltima vez. O Pai do Fuj\xE3o desaba no sof\xE1, sem foro, sem capanga e sem sinal no telefone.","A cidade entra pelo port\xE3o aberto. A mans\xE3o vira cozinha comunit\xE1ria, e o lustre ilumina o maior sarau que aquela sala j\xE1 viu, com {hero} no centro.",'Encurralado, o velho entrega quem est\xE1 acima de todos: "Eu s\xF3 obede\xE7o. As ordens v\xEAm dos Estados Unidos. Do Laranj\xE3o."',"Para salvar o mundo, os Salvadores precisam atravessar o continente. Pr\xF3xima parada: Washington, D.C."],laranjao:["A muralha dourada cai tijolo por tijolo. As manchetes falsas se apagam uma por uma. O Laranj\xE3o fica sem armadura e sem plateia.","No gramado, o povo do mundo inteiro come junto. {hero} rima em portugu\xEAs, e todo mundo canta o refr\xE3o.",'Derrotado, o Laranj\xE3o aponta para o ch\xE3o e ri: "Voc\xEAs acham que mandam aqui? Quem manda est\xE1 l\xE1 embaixo."',"O ch\xE3o do gramado racha. Sobe um cheiro de enxofre. \xDAltima parada da turn\xEA: o inferno do Djabo."],djabo:["O Djabo cai do trono. O fogo do inferno se apaga, as correntes se partem e as almas presas pela fome sobem para a luz.","L\xE1 em cima, todos os Salvadores Nacionais sobem no mesmo palco para o maior show contra a fome da hist\xF3ria.","Em Bel\xE9m, em Washington, em cada cidade do Brasil e do mundo, as mesas ficam cheias. Ningu\xE9m fica de fora.","A FOME ACABOU. Em nenhum canto do mundo algu\xE9m vai dormir com fome esta noite. Nem amanh\xE3.","{ending}","SALVADORES NACIONAIS \u2014 fim da Turn\xEA contra a Fome. Obrigado por jogar!"]},Bt={franco:"Franco fotografa a primeira mesa cheia do mundo inteiro. A foto vira quadro, e o quadro vai para a parede de todas as cozinhas comunit\xE1rias.",belga:"Belga solta o \xFAltimo disco da turn\xEA. O BPM nunca mais baixa: em cada esquina tem um som e um prato de comida.",majis:"Majis toca o acorde final. O ch\xE3o treme, mas desta vez \xE9 de festa: a guitarra vira sino de almo\xE7o.",trunks:"Trunks e a matilha distribuem marmitas de ambul\xE2ncia em ambul\xE2ncia. Nenhum cachorro, nenhuma pessoa, com fome.",ryuchi:"Ryuchi guarda a espada. O agudo final ecoa do inferno at\xE9 o c\xE9u, e o mundo inteiro responde no refr\xE3o.",mdep:"M'Dep pendura as botas por um dia. Na passarela, em vez de grife, desfila a fila de quem j\xE1 comeu.",chapuh:'Chapuh picha o \xFAlti
