<!doctype html><html lang="pt-br"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pavanassi — revisão de sprites</title><style>*{box-sizing:border-box}body{margin:0;background:#161821;color:#f5eedc;font:16px system-ui}header{padding:24px;background:#222632;border-bottom:4px solid #e3bd44;position:sticky;top:0;z-index:2}h1{margin:0 0 12px;font-size:28px}button,input,select{font:inherit;margin:4px;padding:8px;border-radius:6px;border:1px solid #68717d;background:#303746;color:white}button{cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;padding:24px}article{background:#252a35;border:1px solid #4d5566;border-radius:10px;overflow:hidden}h2{font-size:17px;margin:12px 14px 3px}article p{font-size:12px;margin:4px 14px 12px;color:#b8c8d3}canvas{display:block;width:100%;background:repeating-conic-gradient(#353b45 0% 25%,#262c35 0% 50%) 50%/30px 30px}a{color:#f2cb57}footer{padding:24px}</style><header><h1>PAVANASSI · seis quadros · dois sentidos</h1><div id="status"></div><div><select id="side"><option value="all">Ambos os sentidos</option><option value="right">Direita</option><option value="left">Esquerda</option></select><input id="search" placeholder="Filtrar ação"><button id="prevPage">Anterior</button><span id="pageLabel"></span><button id="nextPage">Próxima</button><button id="play">Pausar</button><button id="step">Próximo quadro</button><label>FPS <input id="fps" type="number" min="1" max="24" value="8" style="width:68px"></label><label><input type="checkbox" id="guides" checked> Apoio e centro</label></div></header><main id="grid"></main><footer>Duas pranchas de três desenhos por ação e sentido. Corpo com alpha real. Efeitos em camadas separadas. <a href="previa.html">Corpo</a> · <a href="efeitos-previa.html">Objetos e efeitos</a> · <a href="originais/ui/retrato.png">Retrato</a> · <a href="README.txt">Entrega e integração</a> · <a href="https://ryusarto.github.io/Salvadores-Nacionais/">Jogo publicado</a>.</footer><script>const DATA=__DATA__;let playing=true,frame=0,last=0,cards=[],pageNo=0;const grid=document.getElementById('grid');document.getElementById('status').textContent=DATA.generatedAnimations+' / '+DATA.expectedAnimations+' animações · '+DATA.generatedDrawings+' desenhos · '+(DATA.complete?'corpo completo':'produção em andamento');function build(){grid.textContent='';cards=[];const order=new Map((DATA.actions||[]).map((a,i)=>[a.action,i])),filtered=DATA.animations.filter(a=>(side.value==='all'||a.side===side.value)&&(a.action+' '+a.name).toLowerCase().includes(search.value.toLowerCase())).sort((a,b)=>(order.get(a.action)||0)-(order.get(b.action)||0)||a.action.localeCompare(b.action)||b.side.localeCompare(a.side));pageNo=Math.max(0,Math.min(pageNo,Math.max(0,Math.ceil(filtered.length/8)-1)));pageLabel.textContent='Página '+(pageNo+1)+' de '+Math.max(1,Math.ceil(filtered.length/8));prevPage.disabled=pageNo===0;nextPage.disabled=(pageNo+1)*8>=filtered.length;for(const a of filtered.slice(pageNo*8,pageNo*8+8)){const el=document.createElement('article'),h=document.createElement('h2'),info=document.createElement('p'),c=document.createElement('canvas');h.textContent=a.name+' · '+(a.side==='fx'?'Efeito':a.side==='right'?'Direita':'Esquerda');info.innerHTML=(a.sourceSheets||[]).map((p,i)=>'<a href="'+p+'">Original '+(i+1)+'</a>').join(' · ')+'<br>'+a.action+' · <a href="'+a.board+'">prancha</a> · <a href="'+a.file+'">tira PNG</a> · <a href="'+a.runtime+'">WebP</a>';c.width=c.height=500;el.append(h,c,info);grid.append(el);const im=new Image;im.src=a.file;cards.push({c,im,a});im.onload=draw}draw()}function draw(){for(const {c,im}of cards){const ctx=c.getContext('2d');ctx.clearRect(0,0,500,500);if(im.complete&&im.naturalWidth)ctx.drawImage(im,frame*500,0,500,500,0,0,500,500);if(guides.checked){ctx.strokeStyle='#e7be50aa';ctx.beginPath();ctx.moveTo(0,456);ctx.lineTo(500,456);ctx.moveTo(250,0);ctx.lineTo(250,500);ctx.stroke()}ctx.fillStyle='#f4d265';ctx.font='16px system-ui';ctx.fillText((frame+1)+'/6',14,26)}}function tick(t){if(playing&&t-last>1000/Math.max(1,+fps.value)){frame=(frame+1)%6;last=t;draw()}requestAnimationFrame(tick)}play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Continuar'};step.onclick=()=>{playing=false;play.textContent='Continuar';frame=(frame+1)%6;draw()};side.onchange=search.oninput=()=>{pageNo=0;build()};prevPage.onclick=()=>{pageNo--;build()};nextPage.onclick=()=>{pageNo++;build()};guides.onchange=draw;build();requestAnimationFrame(tick);</script></html>
