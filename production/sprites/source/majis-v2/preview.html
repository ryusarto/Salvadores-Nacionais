<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Majis — sprites completos</title><style>body{background:#191b22;color:#eee;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#292d38;border-radius:8px}h2{font-size:14px;padding:10px}canvas{width:100%}a{color:#8eeaff}</style><h1>MAJIS — 40 animações e 8 FX</h1><p>768×768 por quadro · apoio (384,700) · Flying V · figurino preto e branco · silhueta magra</p><p><a href="rosto-expressoes.png">Modelo facial e expressões</a></p><main></main><script>fetch("manifest.json").then(r=>r.json()).then(m=>{for(const s of m.sequences){const a=document.createElement("article");a.innerHTML="<h2>"+s.name+"</h2>";const c=document.createElement("canvas");c.width=c.height=768;a.append(c);document.querySelector("main").append(a);const x=c.getContext("2d"),im=new Image();im.src=s.strip;im.onload=()=>{function t(){x.clearRect(0,0,768,768);x.drawImage(im,Math.floor(Date.now()/180)%4*768,0,768,768,0,0,768,768);requestAnimationFrame(t)}t()}}});</script></html>
