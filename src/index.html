<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SALVADORES NACIONAIS — Build de Combate</title>
<style>
  html, body { margin: 0; height: 100%; background: #08040a; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; background: #12080c; }
  #sound {position:fixed;right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:3;border:2px solid #17131b;border-radius:0;background:#f4e9c9;color:#17131b;font:15px SNComic,Arial,sans-serif;padding:5px 12px;cursor:pointer;}
  /* Fora do menu inicial o botão cobriria títulos, nomes e medidores: na luta o som fica na pausa. */
  body:not([data-screen="title"]):not([data-screen="controls"]) #sound {display:none;}
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; font-family: Impact, 'Arial Black', sans-serif; }
  .touch #touch { display: block; }
  #touch > * { pointer-events: auto; position: absolute; }
  #dpad { left: max(3vw, env(safe-area-inset-left)); bottom: 6vh; width: 40vh; height: 40vh; border-radius: 50%; background: rgba(255,255,255,.10); border: 2px solid rgba(255,255,255,.35); }
  #dpad .a { position: absolute; font-style: normal; color: rgba(255,255,255,.6); font-size: 5vh; pointer-events: none; }
  #dpad .up { top: 5%; left: 50%; transform: translateX(-50%); }
  #dpad .down { bottom: 5%; left: 50%; transform: translateX(-50%); }
  #dpad .left { left: 6%; top: 50%; transform: translateY(-50%); }
  #dpad .right { right: 6%; top: 50%; transform: translateY(-50%); }
  #knob { position: absolute; left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%; background: rgba(255,255,255,.28); border: 2px solid rgba(255,255,255,.6); pointer-events: none; }
  #btns { right: max(2.5vw, env(safe-area-inset-right)); bottom: 5vh; display: grid; grid-template-columns: repeat(3, 17vh); gap: 2.2vh 2.4vh; }
  .tb { width: 17vh; height: 17vh; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.13); color: #fff; font: italic 900 3.1vh Impact, 'Arial Black', sans-serif; padding: 0; -webkit-tap-highlight-color: transparent; }
  .tb.on, #tpause.on { background: rgba(255,255,255,.45); transform: scale(.94); }
  .tb-l, .tb-m, .tb-h { transform: translateY(0); }
  .tb-s { transform: translateY(-2.5vh); } .tb-x { transform: translateY(-5vh); }
  .tb-m { transform: translateY(-2.5vh); } .tb-h { transform: translateY(-5vh); }
  .tb-g { border-color: rgba(53,214,192,.9); color: #9ff5e8; }
  .tb-s { border-color: rgba(255,207,42,.9); color: #ffe14a; }
  .tb-x { border-color: rgba(255,122,46,.9); color: #ffb37a; }
  #tpause { top: 2vh; left: max(1.5vw, env(safe-area-inset-left)); width: 11vh; height: 8vh; border-radius: 2vh; border: 2px solid rgba(255,255,255,.4); background: rgba(0,0,0,.35); color: #fff; font: 900 3vh Arial, sans-serif; }
  #rotate { display: none; inset: 0; background: #12080c; color: #ffcf2a; font-size: 7vw; align-items: center; justify-content: center; text-align: center; padding: 8vw; font-style: italic; }
  @media (orientation: portrait) { .touch #rotate { display: flex; } }
  #loading {position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:#f3c426;color:#17131b;font:italic 900 7vmin Impact,'Arial Black',sans-serif;letter-spacing:.02em;text-align:center;}
  #loading b {color:#f4e9c9;-webkit-text-stroke:.35vmin #17131b;paint-order:stroke;text-shadow:.6vmin .6vmin 0 #dc3029;line-height:1;}
  #loading span {font-size:2.6vmin;letter-spacing:.12em;}
  #loading i {display:block;width:36vmin;height:1.6vmin;border:.4vmin solid #17131b;background:#f4e9c9;overflow:hidden;position:relative;}
  #loading i::after {content:"";position:absolute;inset:0;width:35%;background:#dc3029;animation:sn-load 1.1s ease-in-out infinite alternate;}
  @keyframes sn-load {from{transform:translateX(0)}to{transform:translateX(186%)}}
  @media (prefers-reduced-motion: reduce) { #loading i::after { animation:none; width:100%; } }

  [hidden] { display:none !important; }
  #accessible-menu { position:fixed;left:var(--canvas-left);top:var(--canvas-top);width:var(--canvas-width);height:var(--canvas-height);z-index:5;pointer-events:none; }
  #accessible-menu h1,#accessible-menu p {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
  #accessible-menu nav {position:absolute;inset:0;pointer-events:none;}
  #accessible-menu button {position:absolute;pointer-events:auto;opacity:0;cursor:pointer;border:3px solid #f3c426;}
  #accessible-menu button:focus-visible {opacity:1;background:#17131b;color:#f4e9c9;font:24px SNComic,Arial,sans-serif;outline:4px solid #f3c426;}
  #touch:not([data-live="true"]) #dpad,#touch:not([data-live="true"]) #btns,#touch:not([data-live="true"]) #tpause,#touch:not([data-live="true"]) #question {display:none;}
  #tpause {min-width:44px;min-height:44px;}
  .tb-t {grid-column:2;transform:none;width:100%;height:44px;border-radius:10px;font-size:14px;}
  #btns {bottom:max(16vh,env(safe-area-inset-bottom));grid-template-columns:repeat(3,var(--touch-size,15vh));gap:1.5vh;}
  .tb {width:var(--touch-size,15vh);height:var(--touch-size,15vh);min-width:44px;min-height:44px;font-size:clamp(11px,2.7vh,18px);}
  #dpad {bottom:16vh;width:36vh;height:36vh;}
  #question {left:43%;bottom:12vh;width:auto;padding:8px;height:44px;border-radius:10px;font-size:12px;}
  #training-tools {position:fixed;top:15vh;left:22%;right:22%;display:flex;gap:4px;justify-content:center;}
  #training-tools button,#lesson-panel button {min-height:44px;background:#f4e9c9;color:#17131b;border:2px solid #17131b;font:14px SNComic,Arial,sans-serif;padding:4px 8px;}
  #lesson-panel {position:fixed;left:18%;right:18%;top:14vh;background:#17131b;color:#f4e9c9;font:14px Arial,sans-serif;padding:8px;display:flex;align-items:center;gap:8px;}
  #rotate {z-index:30;pointer-events:auto;}
  .large-buttons {--touch-size:17vh;}
  .left-handed #dpad {left:auto;right:3vw;}
  .left-handed #btns {right:auto;left:2.5vw;}
  .touch #accessible-menu {inset:0;width:auto;height:auto;padding:16px max(20px,env(safe-area-inset-right)) 16px max(20px,env(safe-area-inset-left));box-sizing:border-box;background:#f4e9c9;color:#17131b;display:flex;flex-direction:column;gap:8px;pointer-events:auto;overflow:auto;}
  .touch #accessible-menu h1,.touch #accessible-menu p {position:static;width:auto;height:auto;overflow:visible;clip-path:none;margin:0;}
  .touch #accessible-menu h1 {font:clamp(22px,5vh,34px) SNComic,Arial,sans-serif;}
  .touch #accessible-menu p {font:16px/1.35 Arial,sans-serif;max-width:75ch;}
  .touch #accessible-menu nav {position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;pointer-events:auto;}
  .touch #accessible-menu button {position:static;opacity:1;width:auto!important;height:auto!important;min-height:48px;border:2px solid #17131b;background:#f3c426;color:#17131b;font:18px SNComic,Arial,sans-serif;padding:8px;}
  .touch #accessible-menu button[aria-pressed="true"] {background:#dc3029;color:#fff;}
  .touch #accessible-menu button:focus-visible {outline:3px solid #17131b;outline-offset:2px;}
  .touch #accessible-menu button {display:flex;align-items:center;justify-content:center;gap:8px;}
  .touch #accessible-menu button img {width:44px;height:44px;object-fit:contain;}
  #accessible-menu button img {width:32px;height:32px;object-fit:contain;}
  .tb.tb-t {width:100%;height:44px;min-height:44px;transform:none;}
  .touch #sound {display:none;}
</style>
</head>
<body>
<canvas id="game" width="1920" height="1080" aria-label="Arena de combate Salvadores Nacionais"></canvas>
<div id="loading" role="status" aria-live="polite"><b>SALVADORES<br>NACIONAIS</b><i></i><span>CARREGANDO…</span></div>
<button id="sound" type="button" aria-label="Silenciar ou ativar som" aria-pressed="false">SOM: LIGADO</button>
<script>/*__BUNDLE__*/</script>
</body>
</html>
